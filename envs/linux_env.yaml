name: hyena4d_linux
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults

dependencies:
  - python=3.10
  - pytorch=2.2.0
  - torchvision=0.17.0
  - torchaudio=2.2.0
  - pytorch-cuda=12.1  
  - cudatoolkit=12.1

  - numpy<2
  - scipy
  - pandas
  - scikit-learn

  - pillow
  - imageio
  - h5py

  - tqdm
  - pyyaml

  - pip

  - pip:
      - timm>=0.9.12
      - einops
      - ninja
      - typing-extensions
      - matplotlib
      - opencv-python
      - nibabel
