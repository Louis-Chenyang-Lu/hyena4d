name: hyena4d_linux
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults

dependencies:
  - python=3.10

  - numpy<2
  - scipy
  - pandas
  - scikit-learn

  - pillow
  - imageio
  - h5py

  - tqdm
  - pyyaml

  - pip

  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu121
      - torch==2.2.0+cu121
      - torchvision==0.17.0+cu121
      - torchaudio==2.2.0+cu121
      - timm>=0.9.12
      - einops
      - ninja
      - typing-extensions
      - matplotlib
      - opencv-python
      - nibabel
